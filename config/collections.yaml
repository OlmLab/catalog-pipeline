- id: dense-longitudinal-subjects
  title: Densely sampled subjects (≥ 5 gut samples per subject)
  kind: design
  blurb: Every subject in the catalog with at least five gut samples linked to the same subject_id — the time-series
    slice for strain tracking, stability and perturbation-recovery analyses. Dominated by infant birth cohorts (TEDDY,
    DIABIMMUNE), IBDMDB and adult time-series studies.
  filters:
    min_samples_per_subject:
