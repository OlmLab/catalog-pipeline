schema_version: 1
package_version_validated: 1.11.0
generated: '2026-09-29'
note: 'Curated, named sets of catalog studies/samples with pre-entered explorer filters. Semantics: `studies` restricts
  to the listed accessions; `filters` restrict samples (list = any-of, {min,max} = inclusive range); when both are
  present the filters apply within the listed studies. Propose changes by PR (docs/COLLECTIONS.md).'
collections:
- id: hmp1-healthy-adults
  title: HMP1 healthy adult reference (Human Microbiome Project, WGS)
  kind: benchmark
  blurb: The NIH Human Microbiome Project phase 1 shotgun metagenomes of clinically healthy US adults (Houston and
    St Louis), the most reused healthy-adult reference set; the BioProject spans all HMP body sites, so restrict
    to gut samples with body_site_class.
  studies:
  - PRJNA48479
  - PRJNA275349
  filters:
    body_site_class:
    - primary
  references:
  - label: Human Microbiome Project Consortium 2012, Nature
    url: https://doi.org/10.1038/nature11234
  - label: Lloyd-Price et al. 2017, Nature (expanded HMP1-II)
    url: https://doi.org/10.1038/nature23889
  notes: PRJNA275349 is the HMP phase III WGS deposit (JCVI). Both BioProjects contain oral, skin and vaginal samples;
    the body_site_class filter keeps the gut ones.
- id: hmp2-ibdmdb
  title: HMP2 / IBDMDB longitudinal IBD multi-omics cohort
  kind: benchmark
  blurb: 'The Integrative HMP inflammatory bowel disease cohort (IBDMDB): 132 subjects with Crohn''s disease, ulcerative
    colitis or no IBD, followed for one year with stool metagenomes, metatranscriptomes and biopsies at five US
    centres.'
  studies:
  - PRJNA398089
  - PRJNA389280
  references:
  - label: Lloyd-Price et al. 2019, Nature
    url: https://doi.org/10.1038/s41586-019-1237-9
  - label: Schirmer et al. 2018, Nature Microbiology (metatranscriptomes)
    url: https://doi.org/10.1038/s41564-017-0089-z
  - label: IBDMDB data portal
    url: https://ibdmdb.org/
- id: metahit
  title: MetaHIT European gut metagenome cohorts
  kind: benchmark
  blurb: 'The MetaHIT consortium deposits underlying the first gut gene catalogue and the metagenomic-species work:
    Danish and Spanish adults (Qin 2010), Danish obese/lean adults (Le Chatelier 2013, Nielsen 2014) and the integrated
    gene catalogue samples (Li 2014).'
  studies:
  - PRJEB2054
  - PRJEB4336
  - PRJEB1220
  - PRJEB5224
  references:
  - label: Qin et al. 2010, Nature
    url: https://doi.org/10.1038/nature08821
  - label: Le Chatelier et al. 2013, Nature
    url: https://doi.org/10.1038/nature12506
  - label: Nielsen et al. 2014, Nature Biotechnology
    url: https://doi.org/10.1038/nbt.2939
  - label: Li et al. 2014, Nature Biotechnology (IGC)
    url: https://doi.org/10.1038/nbt.2942
  notes: Single-subject MetaHIT BioProjects (PRJNA33049 … 'Human Gut Subject MH6 Metagenome', 1 sample each) exist
    in the catalog but are not listed here.
- id: healthy-adult-reference
  title: Curated healthy adult gut samples (all studies)
  kind: benchmark
  blurb: Every gut sample in the curated catalog whose source states the subject is healthy or a control and whose
    age at collection falls in the adult band (18–65 y). The catalog's own counterpart of the curatedMetagenomicData
    healthy-adult set; membership is evidence-backed per sample.
  filters:
    health_condition:
    - healthy_control
    age_category:
    - adult
    body_site_class:
    - primary
  references:
  - label: Pasolli et al. 2017, Nature Methods (curatedMetagenomicData)
    url: https://doi.org/10.1038/nmeth.4468
  notes: 'Not the cMD study list: the set is defined by the catalog''s per-sample health_condition and age_category
    determinations, so it grows with every release.'
- id: protocol-benchmarks-mock-controls
  title: Protocol benchmarks with mock-community controls
  kind: benchmark
  blurb: Human stool studies that sequenced a defined mock community (ZymoBIOMICS or in-house standards) alongside
    real samples to compare DNA extraction kits, library protocols or 16S versus shotgun profiling — useful as positive
    controls and for bias estimation.
  studies:
  - PRJEB38036
  - PRJEB75510
  - PRJNA648321
  - PRJNA911046
  - PRJNA725047
  references:
  - label: Multicenter evaluation of gut microbiome profiling (PRJNA911046)
    url: https://doi.org/10.1038/s41598-023-46062-7
  - label: DNA extraction kits for long-read shotgun metagenomics (PRJEB75510)
    url: https://doi.org/10.1038/s41598-024-80660-3
  notes: Selected by the word 'mock' in the ENA study description; the mock-community runs themselves are not human
    samples and may be classified body_site_class excluded/unknown.
- id: american-gut-shotgun
  title: American Gut Project shotgun subset
  kind: population
  blurb: Shotgun metagenomes from the crowd-sourced American Gut Project (US, UK and Australia self-collected stool
    with extensive diet and lifestyle questionnaires); the largest single citizen-science deposit in the catalog.
  studies:
  - PRJEB11419
  references:
  - label: McDonald et al. 2018, mSystems
    url: https://doi.org/10.1128/mSystems.00031-18
- id: predict-diet-cohorts
  title: PREDICT personalised-nutrition cohorts (UK/US)
  kind: population
  blurb: ZOE PREDICT 1, 2 and 3 deep-phenotyped adults (TwinsUK and volunteers in the UK and US) with habitual-diet
    records and postprandial metabolic responses; PREDICT 3 adds more than 20,000 stool metagenomes.
  studies:
  - PRJEB39223
  - PRJEB75460
  - PRJEB75463
  - PRJEB75464
  references:
  - label: Asnicar et al. 2021, Nature Medicine (PREDICT 1)
    url: https://doi.org/10.1038/s41591-020-01183-8
  notes: PREDICT 2/3 BioProjects were located by study title in the package; no primary PREDICT 3 paper is linked
    in registry_study_papers yet.
- id: hadza-hunter-gatherers
  title: Hadza hunter-gatherers (Tanzania)
  kind: population
  blurb: 'All shotgun deposits from the Hadza of Tanzania, the reference hunter-gatherer population: Rampelli 2015,
    the seasonal-cycling cohort (Smits 2017) and the deep-sequenced adults and infants of Carter 2023 / Olm 2022
    (with Nepali comparison groups in the same BioProject).'
  studies:
  - PRJNA278393
  - PRJNA392180
  - PRJEB49206
  filters:
    lifestyle:
    - hunter_gatherer
  references:
  - label: Rampelli et al. 2015, Current Biology
    url: https://doi.org/10.1016/j.cub.2015.04.055
  - label: Smits et al. 2017, Science
    url: https://doi.org/10.1126/science.aan4834
  - label: Carter et al. 2023, Cell
    url: https://doi.org/10.1016/j.cell.2023.05.046
  - label: Olm et al. 2022, Science
    url: https://doi.org/10.1126/science.abj2972
  notes: lifestyle is a 1.12.0 field; until it is populated the explicit study list defines the collection. PRJEB49206
    also holds Nepali Chepang/Raji/Raute/Tharu samples.
- id: olm-2022-lifestyle-infants
  title: Olm 2022 Hadza infant cohort (lifestyle spectrum)
  kind: lifestyle
  blurb: Infant stool metagenomes from the Hadza deposited with Olm et al. 2022 (Science), the non-industrialized
    anchor of the infant lifestyle-spectrum comparison; restricted to the neonate/infant age bands of BioProject
    PRJEB49206.
  studies:
  - PRJEB49206
  filters:
    age_category:
    - neonate
    - infant
  references:
  - label: Olm et al. 2022, Science
    url: https://doi.org/10.1126/science.abj2972
  - label: bioRxiv preprint (data statement)
    url: https://doi.org/10.1101/2022.03.30.486467
  notes: The paper's global lifestyle comparison used public 16S data (not in this shotgun catalog); its shotgun
    comparators are industrialized infant cohorts already present as separate studies (use age_category=infant with
    country filters).
- id: amazonian-amerindian
  title: Amazonian and Amerindian communities
  kind: population
  blurb: 'Indigenous South American communities with traditional subsistence: Matses hunter-gatherers and Tunapuco
    highland agriculturalists (Peru), Yanomami and Yekwana villages (Venezuela, Brazil) and the Wayampi of French
    Guiana — the low-industrialization reference for Prevotella/Treponema-rich microbiomes.'
  studies:
  - PRJNA268964
  - PRJEB55648
  - PRJNA245336
  - PRJNA527208
  - PRJEB101387
  - PRJNA418044
  filters:
    lifestyle:
    - hunter_gatherer
    - traditional_agriculturalist
    - indigenous_community
  references:
  - label: Obregon-Tito et al. 2015, Nature Communications (Matses/Tunapuco)
    url: https://doi.org/10.1038/ncomms7505
  - label: Clemente et al. 2015, Science Advances (Yanomami)
    url: https://doi.org/10.1126/sciadv.1500183
  - label: Wayampi resistome (PRJEB101387)
    url: https://doi.org/10.1186/s40168-026-02345-5
  notes: PRJNA418044 is a fecal virome of uncontacted Amerindian children (shotgun, but virus-enriched). lifestyle
    filter becomes effective in 1.12.0.
