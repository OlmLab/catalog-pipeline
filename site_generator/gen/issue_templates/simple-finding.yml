# Simple finding form (R2026.12, site restructure item 8). Opened prefilled by the "Flag an issue" link of every study and cohort page:
#   …/issues/new?template=simple-finding.yml&labels=finding&title=[finding] <accession>&accession=<acc>&release_id=<Rxxxx.n>&page_url=<url>
# GitHub issue forms have no hidden fields: accession / release_id / page_url are ordinary inputs prefilled by the link and marked
# "filled automatically". INSTALL into the Issues repo (config/site.yaml github.issues.repo): `make install-workflows` copies
# .github/ISSUE_TEMPLATE/*.yml; add this file there or copy it by hand — see docs/CONTRIBUTE.md §"Flag an issue".
name: Flag an issue
description: "Something on a study, cohort or sample page is wrong or missing — two questions, one minute."
title: "[finding] <accession>"
labels: ["finding"]
body:
  - type: dropdown
    id: problem
    attributes:
      label: "What is wrong or missing?"
      options: ["a value is wrong", "a value is missing", "the study should not be in the catalog", "something else"]
    validations: { required: true }
  - type: textarea
    id: details
    attributes:
      label: "Tell us more"
      description: "Which field or sample, what the correct value is, and where it can be checked (a paper section, a supplementary table, an archive attribute). A short verbatim quote of the source helps us apply it."
    validations: { required: true }
  - type: input
    id: accession
    attributes:
      label: "accession (filled automatically — leave as is)"
      placeholder: PRJNA294605
    validations: { required: true }
  - type: input
    id: release_id
    attributes:
      label: "release id (filled automatically — leave as is)"
      placeholder: R2026.12
  - type: input
    id: page_url
    attributes:
      label: "page URL (filled automatically — leave as is)"
